name: Maintenance validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  node24:
    name: Required / ${{ matrix.os }} / Node 24
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci --no-audit --no-fund
      - run: npm run build --workspaces
      - run: npm run build
      - run: npm run test:offline-guard
      - run: npm run test:characterization
      - run: npm run test:characterization
      - run: npm run test:cli
      - run: npm run test:mutations
      - run: npm run test:offline -- --silent --verbose --coverage --detectOpenHandles
      - run: npm run manifest
      - run: npm run pack:maintenance
      - run: npm run test:consumer

  runtime-probe:
    name: Diagnostic / ${{ matrix.os }} / Node 26
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Compatibility probe only; Node 26 is outside the supported engines.
          node-version: '26.10.0'
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci --no-audit --no-fund
      - run: npm run build --workspaces
      - run: npm run build
      - run: npm run test:offline-guard
      - run: npm run test:characterization
      - run: npm run test:characterization
      - run: npm run test:cli
      - run: npm run test:mutations
      - run: npm run test:offline -- --silent --verbose --coverage --detectOpenHandles
      - run: npm run manifest
      - run: npm run pack:maintenance
      - run: npm run test:consumer
