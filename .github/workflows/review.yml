name: Maintenance validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline / ${{ matrix.os }} / Node 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Historical comparison only; this is not a production support policy.
          node-version: '20.20.2'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:offline-guard
      - run: npm run test:characterization
      - run: npm run test:characterization
      - run: npm run test:cli
      - run: npm run test:mutations
      # Keep inherited failures visible. Do not silently exclude failing suites.
      - run: npm run test:offline -- --silent --verbose --coverage --detectOpenHandles

  runtime-probe:
    name: Diagnostic / ${{ matrix.os }} / Node ${{ matrix.node }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.23.2', '24.12.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Reproduce the local baseline probes, not a selected upgrade target.
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node -e "const db=require('better-sqlite3')(':memory:'); if(db.prepare('select 1 as value').get().value!==1) process.exitCode=1; db.close()"
      - run: npm run build
      - run: npm run test:characterization
      - run: npm run test:cli
